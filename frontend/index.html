<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan Track System</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b2545'/%3E%3Cpath d='M8 21l5-6 4 3 7-9' stroke='%2334b77a' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <!-- Login screen for staff and clients -->
  <main id="login-view" class="login-wrap" hidden>
    <form id="login-form" class="login-card" novalidate>
      <div class="brand brand-lg"><span class="logo" aria-hidden="true"></span><span>Loan Track System</span></div>
      <p class="muted">Sign in</p>
      <label for="login-username">Staff username or client email</label>
      <input id="login-username" autocomplete="username" required>
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="field-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      <p class="muted login-switch">New client? <button id="show-register" class="text-btn" type="button">Create an account</button></p>
    </form>
  </main>

  <main id="register-view" class="login-wrap" hidden>
    <form id="register-form" class="login-card" novalidate>
      <div class="brand brand-lg"><span class="logo" aria-hidden="true"></span><span>Loan Track System</span></div>
      <p class="muted">Create a client account to request a loan.</p>
      <label for="register-name">Full name *</label>
      <input id="register-name" maxlength="120" autocomplete="name" required>
      <label for="register-phone">Phone number *</label>
      <input id="register-phone" maxlength="25" autocomplete="tel" required>
      <label for="register-email">Email *</label>
      <input id="register-email" type="email" maxlength="254" autocomplete="email" required>
      <label for="register-password">Password *</label>
      <input id="register-password" type="password" minlength="8" autocomplete="new-password" required>
      <div id="register-error" class="field-error" role="alert"></div>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
      <p class="muted login-switch">Already registered? <button id="show-login" class="text-btn" type="button">Sign in</button></p>
    </form>
  </main>

  <main id="password-view" class="login-wrap" hidden>
    <form id="password-form" class="login-card" novalidate>
      <div class="brand brand-lg"><span class="logo" aria-hidden="true"></span><span>Change temporary password</span></div>
      <p class="muted">Choose a new password before continuing.</p>
      <label for="new-password">New password *</label>
      <input id="new-password" type="password" minlength="8" autocomplete="new-password" required>
      <label for="confirm-password">Confirm new password *</label>
      <input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required>
      <div id="password-error" class="field-error" role="alert"></div>
      <button class="btn btn-primary btn-block" type="submit">Save password</button>
    </form>
  </main>

  <!-- App shell (shown after login) -->
  <div id="app-view" class="shell" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="brand"><span class="logo" aria-hidden="true"></span><span>Loan Track System</span></div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="sidebar-foot">
        <span id="whoami" class="muted-light"></span>
        <button id="logout-btn" class="btn btn-ghost-light btn-sm" type="button">Sign out</button>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>
    <div class="main">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="Open menu"></button>
        <h1 id="page-title">Dashboard</h1>
      </header>
      <section id="page" class="page" aria-live="polite"></section>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/js/app.js"></script>
</body>
</html>
